name: release

# Tauri has no meaningful cross-compilation story, so each target is built on
# its own runner and the results are collected into one draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core suites
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ""
            label: linux-x86_64
          - platform: windows-latest
            target: ""
            label: windows-x86_64
          - platform: macos-latest
            target: "--target aarch64-apple-darwin"
            label: macos-aarch64
          - platform: macos-latest
            target: "--target x86_64-apple-darwin"
            label: macos-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK is the Linux webview; without it the bundle will not link.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.label }}

      - run: npm ci

      # The icon set is derived from assets/app.png and is not in the repository.
      # tauri-action runs `tauri build` directly rather than `npm run app:build`,
      # so it never reaches the guard that generates them — this step is what
      # puts them there, and without it the bundle has no icons to package.
      - name: Icons
        run: npx tauri icon assets/app.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "eFeFlow ${{ github.ref_name }}"
          releaseBody: |
            Visual nftables firewall rule designer.

            Local `nft` integration is Linux-only; on Windows and macOS point
            eFeFlow at a firewall over SSH.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.target }}
