name: release

# Tauri has no meaningful cross-compilation story, so each target is built on
# its own runner and the results are collected into one release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Core suites
        run: npm test

      # v0.9.0 was tagged while the sources said 0.9.10, which would have
      # produced installers named efeflow_0.9.10 inside a release called
      # "eFeFlow v0.9.0" — the version somebody reports a bug against and the
      # version they downloaded, disagreeing. Three files carry it and all
      # three have to say the same thing as the tag.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json src-tauri/tauri.conf.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$tag" ] || { echo "::error::$f says $v, the tag says $tag"; exit 1; }
          done
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          [ "$v" = "$tag" ] || { echo "::error::Cargo.toml says $v, the tag says $tag"; exit 1; }
          echo "all three say $tag"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ""
            label: linux-x86_64
          - platform: windows-latest
            target: ""
            label: windows-x86_64
          - platform: macos-latest
            target: "--target aarch64-apple-darwin"
            label: macos-aarch64
          - platform: macos-latest
            target: "--target x86_64-apple-darwin"
            label: macos-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK is the Linux webview; without it the bundle will not link.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.label }}

      - run: npm ci

      # The icon set is committed, because `tauri::generate_context!()` opens it
      # at compile time and a clean clone has to be able to run `cargo check`.
      # This regenerates it anyway, so that what ships is derived from
      # assets/app.png even if somebody changed the artwork and did not run
      # `npm run icons` — the master is the one file worth trusting here.
      - name: Icons
        run: npx tauri icon assets/app.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "eFeFlow ${{ github.ref_name }}"
          releaseBody: |
            Visual nftables firewall rule designer.

            Local `nft` integration is Linux-only; on Windows and macOS point
            eFeFlow at a firewall over SSH.
          # Published, because a draft is visible to the owner and to nobody
          # else — v0.9.0 sat as one, so the README's install link pointed at
          # nothing for everybody who could not already build this.
          #
          # Still a prerelease, which is what it is. That leaves it out of
          # GitHub's `latest`, so the README links to the releases list
          # instead: one more click, and nothing has to claim the tool is ready
          # to depend on in order for somebody to download it.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.target }}
