[package]
name = "efeflow"
version = "1.0.0"
description = "Visual nftables firewall rule designer"
authors = ["eFe"]
license = "MIT"
repository = "https://github.com/alegoriasoft/efeflow"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[features]
# Used by `tauri dev` / `tauri build` — do not remove.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
