name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # playwright is here for `npm run shots`, which regenerates the README
      # images on a maintainer's machine. Nothing in CI drives a browser, so
      # the ~150MB of browsers its install script fetches were downloaded on
      # every run and never opened.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Core suites
        run: npm test
      - name: Frontend build
        run: npm run build

  # Everything else here is this project checking its own reading of nftables.
  # This asks nftables: each ruleset is loaded into a network namespace of its
  # own, before and after eFeFlow re-emits it, and the two are compared as nft
  # itself lists them back. A round trip that keeps the text and changes the
  # meaning fails here and nowhere else.
  # ubuntu-latest rather than 22.04: that image ships nft 1.0.2, which will not
  # parse a concatenated set lookup at all — a construct these rulesets use and
  # every nft since takes.
  differ:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: The authority
        run: sudo apt-get update && sudo apt-get install -y nftables
      # --require, because a skip that reports success is a green tick that
      # only means nobody checked
      - name: Round-trip against nft
        run: npm run differ -- --require
      # And the evaluator against netfilter itself: real packets through a real
      # instance, one counter per expression, compared with what the simulator
      # says about the same packet.
      - name: Evaluator against the kernel
        run: npm run oracle -- --require

  # The frontend in a real engine, on every push. jsdom stubs every
  # measurement, so layout, CSS and real drag events pass it untouched — and
  # the built-app e2e runs only on Windows, only before a release. This drives
  # the production build in the Chromium that `npm run shots` already
  # depends on; the Tauri bridge stays the Windows run's job.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # ~120MB once, then the cache answers; the version is pinned by the
      # lockfile, so the key follows it
      - name: Cache the engine
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: A real engine
        run: npx playwright install --with-deps chromium
      - name: Journeys
        run: npm run e2e:browser

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
